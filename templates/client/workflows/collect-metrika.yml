name: Collect Yandex Metrika

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.repository_id }}-seohub-writer
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Read project configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet PyYAML==6.0.2
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml
          from pathlib import Path
          c = yaml.safe_load(Path("project.yaml").read_text(encoding="utf-8"))
          s = c.get("sources", {}).get("yandex_metrika", {})
          enabled = bool(s.get("enabled", False))
          print(f"enabled={'true' if enabled else 'false'}")
          if enabled:
              for key in ("counter_id", "attribution"):
                  if s.get(key) in (None, ""):
                      raise SystemExit(f"project.yaml: sources.yandex_metrika.{key} is required")
              print(f"project_id={c['id']}")
              print(f"counter_id={s['counter_id']}")
              print(f"attribution={s['attribution']}")
              print(f"url_normalization_config={'config/url-normalization.json' if Path('config/url-normalization.json').is_file() else ''}")
          PY
      - id: collect
        if: steps.config.outputs.enabled == 'true'
        uses: __SEOHUB_CLIENT_REPOSITORY__/actions/collect-metrika@__SEOHUB_CLIENT_VERSION__
        with:
          project: ${{ steps.config.outputs.project_id }}
          counter_id: ${{ steps.config.outputs.counter_id }}
          attribution: ${{ steps.config.outputs.attribution }}
          token: ${{ secrets.YANDEX_METRIKA_TOKEN }}
          history_dir: data/normalized/yandex_metrika
          url_normalization_config: ${{ steps.config.outputs.url_normalization_config }}
      - name: Commit normalized Metrika history
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add data/normalized/yandex_metrika
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh Yandex Metrika normalized history"
          git push origin "HEAD:${GITHUB_REF_NAME}"
