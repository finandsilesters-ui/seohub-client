name: Collect Google Search Console

on:
  workflow_dispatch:
    inputs:
      date_from:
        description: Optional explicit start date (YYYY-MM-DD)
        required: false
        type: string
      date_to:
        description: Optional explicit end date (YYYY-MM-DD)
        required: false
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: ${{ github.repository_id }}-seohub-writer
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: config
        name: Read project configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet PyYAML==6.0.2
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml
          from pathlib import Path
          c = yaml.safe_load(Path("project.yaml").read_text(encoding="utf-8"))
          s = c.get("sources", {}).get("google_search_console", {})
          enabled = bool(s.get("enabled", False))
          print(f"enabled={'true' if enabled else 'false'}")
          if enabled:
              if not s.get("site_url"):
                  raise SystemExit("project.yaml: sources.google_search_console.site_url is required")
              print(f"project_id={c['id']}")
              print(f"domain={c['domain']}")
              print(f"site_url={s['site_url']}")
          PY
      - if: steps.config.outputs.enabled == 'true'
        uses: __SEOHUB_CLIENT_REPOSITORY__/actions/hosted-operation@__SEOHUB_CLIENT_VERSION__
        with:
          operation: gsc
          base_url: ${{ vars.SEOHUB_HOSTED_BASE_URL }}
          project_id: ${{ steps.config.outputs.project_id }}
          expected_domain: ${{ steps.config.outputs.domain }}
          site_url: ${{ steps.config.outputs.site_url }}
          days: "14"
          date_from: ${{ inputs.date_from }}
          date_to: ${{ inputs.date_to }}
          google_search_console_credentials_json: ${{ secrets.GOOGLE_SEARCH_CONSOLE_CREDENTIALS_JSON }}
          google_search_console_refresh_token: ${{ secrets.GOOGLE_SEARCH_CONSOLE_REFRESH_TOKEN }}
          storage_backend: ${{ vars.SEOHUB_STORAGE_BACKEND }}
          storage_s3_bucket: ${{ vars.SEOHUB_STORAGE_S3_BUCKET }}
          storage_s3_prefix: ${{ vars.SEOHUB_STORAGE_S3_PREFIX }}
          storage_s3_endpoint_url: ${{ vars.SEOHUB_STORAGE_S3_ENDPOINT_URL }}
          storage_s3_region: ${{ vars.SEOHUB_STORAGE_S3_REGION }}
          storage_s3_access_key_id: ${{ secrets.SEOHUB_STORAGE_S3_ACCESS_KEY_ID }}
          storage_s3_secret_access_key: ${{ secrets.SEOHUB_STORAGE_S3_SECRET_ACCESS_KEY }}
          storage_s3_session_token: ${{ secrets.SEOHUB_STORAGE_S3_SESSION_TOKEN }}
      - name: Commit hosted GSC result
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add data/normalized/google_search_console
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh Google Search Console through hosted SeoHub"
          git push origin "HEAD:${GITHUB_REF_NAME}"
