name: Collect Google Search Console

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.repository_id }}-seohub-writer
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Read project configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet PyYAML==6.0.2
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml
          from pathlib import Path
          c = yaml.safe_load(Path("project.yaml").read_text(encoding="utf-8"))
          s = c.get("sources", {}).get("google_search_console", {})
          enabled = bool(s.get("enabled", False))
          print(f"enabled={'true' if enabled else 'false'}")
          if enabled:
              if not s.get("site_url"):
                  raise SystemExit("project.yaml: sources.google_search_console.site_url is required")
              print(f"project_id={c['id']}")
              print(f"domain={c['domain']}")
              print(f"site_url={s['site_url']}")
          PY
      - id: collect
        if: steps.config.outputs.enabled == 'true'
        uses: __SEOHUB_CLIENT_REPOSITORY__/actions/collect-gsc@__SEOHUB_CLIENT_VERSION__
        with:
          project: ${{ steps.config.outputs.project_id }}
          expected_domain: ${{ steps.config.outputs.domain }}
          site_url: ${{ steps.config.outputs.site_url }}
          credentials_json: ${{ secrets.GOOGLE_SEARCH_CONSOLE_CREDENTIALS_JSON }}
          oauth_refresh_token: ${{ secrets.GOOGLE_SEARCH_CONSOLE_REFRESH_TOKEN }}
          history_dir: data/normalized/google_search_console
      - name: Commit normalized GSC history
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add data/normalized/google_search_console
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh Google Search Console normalized history"
          git push origin "HEAD:${GITHUB_REF_NAME}"
