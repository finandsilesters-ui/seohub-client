name: Generate current state

on:
  workflow_dispatch:
    inputs:
      profile_id:
        description: Optional search profile ID; auto-selected only when exactly one profile exists
        required: false
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: ${{ github.repository_id }}-seohub-writer
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: config
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet PyYAML==6.0.2
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml
          from pathlib import Path
          c = yaml.safe_load(Path("project.yaml").read_text(encoding="utf-8"))
          for key in ("id", "domain"):
              if not c.get(key):
                  raise SystemExit(f"project.yaml: {key} is required")
          print(f"project_id={c['id']}")
          print(f"domain={c['domain']}")
          PY
      - uses: __SEOHUB_CLIENT_REPOSITORY__/actions/hosted-operation@__SEOHUB_CLIENT_VERSION__
        with:
          operation: current-state
          base_url: ${{ vars.SEOHUB_HOSTED_BASE_URL }}
          project_id: ${{ steps.config.outputs.project_id }}
          project_domain: ${{ steps.config.outputs.domain }}
          profile_id: ${{ inputs.profile_id }}
          traffic_days: "7"
          storage_backend: ${{ vars.SEOHUB_STORAGE_BACKEND }}
          storage_s3_bucket: ${{ vars.SEOHUB_STORAGE_S3_BUCKET }}
          storage_s3_prefix: ${{ vars.SEOHUB_STORAGE_S3_PREFIX }}
          storage_s3_endpoint_url: ${{ vars.SEOHUB_STORAGE_S3_ENDPOINT_URL }}
          storage_s3_region: ${{ vars.SEOHUB_STORAGE_S3_REGION }}
          storage_s3_access_key_id: ${{ secrets.SEOHUB_STORAGE_S3_ACCESS_KEY_ID }}
          storage_s3_secret_access_key: ${{ secrets.SEOHUB_STORAGE_S3_SECRET_ACCESS_KEY }}
          storage_s3_session_token: ${{ secrets.SEOHUB_STORAGE_S3_SESSION_TOKEN }}
      - name: Commit compact current state
        shell: bash
        run: |
          set -euo pipefail
          git add data/aggregates/current-state.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: generate current state through hosted SeoHub"
          git push origin "HEAD:${GITHUB_REF_NAME}"
