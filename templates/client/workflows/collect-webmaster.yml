name: Collect Yandex Webmaster

on:
  workflow_dispatch:
    inputs:
      date_from:
        description: "Optional exact start date (YYYY-MM-DD); leave both dates blank for regular refresh."
        required: false
        type: string
      date_to:
        description: "Optional exact end date (YYYY-MM-DD); leave both dates blank for regular refresh."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.repository_id }}-seohub-writer
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Read project configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet PyYAML==6.0.2
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml
          from pathlib import Path
          c = yaml.safe_load(Path("project.yaml").read_text(encoding="utf-8"))
          s = c.get("sources", {}).get("yandex_webmaster", {})
          enabled = bool(s.get("enabled", False))
          print(f"enabled={'true' if enabled else 'false'}")
          if enabled:
              if not s.get("host_id"):
                  raise SystemExit("project.yaml: sources.yandex_webmaster.host_id is required")
              print(f"project_id={c['id']}")
              print(f"host_id={s['host_id']}")
              print(f"timezone={c['timezone']}")
          PY
      - id: collect
        if: steps.config.outputs.enabled == 'true'
        uses: __SEOHUB_CLIENT_REPOSITORY__/actions/collect-webmaster@__SEOHUB_CLIENT_VERSION__
        with:
          project: ${{ steps.config.outputs.project_id }}
          host_id: ${{ steps.config.outputs.host_id }}
          timezone: ${{ steps.config.outputs.timezone }}
          token: ${{ secrets.YANDEX_WEBMASTER_TOKEN }}
          date_from: "${{ inputs.date_from }}"
          date_to: "${{ inputs.date_to }}"
          history_dir: data/normalized/yandex_webmaster
      - name: Commit normalized Webmaster history
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add data/normalized/yandex_webmaster
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh Yandex Webmaster normalized history"
          git push origin "HEAD:${GITHUB_REF_NAME}"
