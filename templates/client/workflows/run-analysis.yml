name: Run SeoHub analysis

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Hosted deterministic analysis
        required: true
        type: choice
        default: traffic-summary
        options:
          - traffic-summary
          - period-analysis
      current_from:
        description: Current period start (YYYY-MM-DD)
        required: true
        type: string
      current_until:
        description: Current period end (YYYY-MM-DD)
        required: true
        type: string
      previous_from:
        description: Previous period start (YYYY-MM-DD)
        required: true
        type: string
      previous_until:
        description: Previous period end (YYYY-MM-DD)
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: ${{ github.repository_id }}-seohub-writer
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: config
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet PyYAML==6.0.2
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml
          from pathlib import Path
          c = yaml.safe_load(Path("project.yaml").read_text(encoding="utf-8"))
          if not c.get("id"):
              raise SystemExit("project.yaml: id is required")
          print(f"project_id={c['id']}")
          PY
      - uses: __SEOHUB_CLIENT_REPOSITORY__/actions/hosted-operation@__SEOHUB_CLIENT_VERSION__
        with:
          operation: ${{ inputs.operation }}
          base_url: ${{ vars.SEOHUB_HOSTED_BASE_URL }}
          project_id: ${{ steps.config.outputs.project_id }}
          current_from: ${{ inputs.current_from }}
          current_until: ${{ inputs.current_until }}
          previous_from: ${{ inputs.previous_from }}
          previous_until: ${{ inputs.previous_until }}
          mover_limit: "5"
          storage_backend: ${{ vars.SEOHUB_STORAGE_BACKEND }}
          storage_s3_bucket: ${{ vars.SEOHUB_STORAGE_S3_BUCKET }}
          storage_s3_prefix: ${{ vars.SEOHUB_STORAGE_S3_PREFIX }}
          storage_s3_endpoint_url: ${{ vars.SEOHUB_STORAGE_S3_ENDPOINT_URL }}
          storage_s3_region: ${{ vars.SEOHUB_STORAGE_S3_REGION }}
          storage_s3_access_key_id: ${{ secrets.SEOHUB_STORAGE_S3_ACCESS_KEY_ID }}
          storage_s3_secret_access_key: ${{ secrets.SEOHUB_STORAGE_S3_SECRET_ACCESS_KEY }}
          storage_s3_session_token: ${{ secrets.SEOHUB_STORAGE_S3_SESSION_TOKEN }}
      - name: Commit compact analytical artifact
        shell: bash
        run: |
          set -euo pipefail
          git add data/aggregates
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: run deterministic analysis through hosted SeoHub"
          git push origin "HEAD:${GITHUB_REF_NAME}"
