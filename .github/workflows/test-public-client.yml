name: Test public SeoHub thin client

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install client test dependencies
        run: python -m pip install -r scripts/project_lifecycle/requirements.txt

      - name: Compile public Python modules
        run: python -m compileall -q scripts

      - name: Run public thin-client regression tests
        run: python -m unittest discover -s tests -p 'test_public_bundle.py'

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Bootstrap fixture and validate generated workflows
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/seohub-public-fixture"
          python -m scripts.project_lifecycle.cli bootstrap             --target "$target"             --client-version "$GITHUB_SHA"             --project-id seo-test             --name "SeoHub Test"             --repository alexfchkjob-stack/seo-test             --domain example.com             --timezone Etc/UTC

          jq -e '.source_repository == "finandsilesters-ui/seohub-client"'             "$target/.seohub/client.json" >/dev/null

          private_repo="finandsilesters-ui/SeoHub"
          if grep -R "$private_repo/actions/" "$target/.github/workflows" examples; then
            echo "private SeoHub action reference leaked into public client" >&2
            exit 1
          fi

          actionlint="$(go env GOPATH)/bin/actionlint"
          "$actionlint" "$target"/.github/workflows/*.yml
          "$actionlint" examples/*.yml
          "$actionlint" .github/workflows/*.yml

  packaged-action-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - id: install
        name: Execute packaged bootstrap Action from this checkout
        uses: ./actions/bootstrap-project
        with:
          client_version: ${{ github.sha }}
          project_id: public-action-smoke
          project_name: Public Action Smoke
          repository: finandsilesters-ui/public-action-smoke
          domain: example.com
          timezone: Etc/UTC

      - name: Verify packaged Action result
        shell: bash
        env:
          STATUS: ${{ steps.install.outputs.status }}
        run: |
          set -euo pipefail
          [[ "$STATUS" == "installed" ]]
          test -f project.yaml
          test -f .seohub/client.json
          test -f .github/workflows/seohub-readiness.yml
          jq -e '.source_repository == "finandsilesters-ui/seohub-client"' .seohub/client.json >/dev/null
          jq -e --arg sha "$GITHUB_SHA" '.installed_version == $sha' .seohub/client.json >/dev/null
