name: Test public SeoHub client

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install client test dependencies
        run: |
          python -m pip install -r scripts/project_lifecycle/requirements.txt
          python -m pip install -r scripts/gsc/requirements.txt

      - name: Compile exported Python modules
        run: python -m compileall -q scripts

      - name: Smoke-import public runtime entry modules
        shell: bash
        run: |
          python - <<'PY'
          import importlib

          modules = [
              "scripts.project_lifecycle.cli",
              "scripts.metrika.collect",
              "scripts.metrika.history",
              "scripts.gsc.collect",
              "scripts.gsc.history",
              "scripts.webmaster.collect",
              "scripts.webmaster.history",
              "scripts.storage.cli",
              "scripts.analysis.project_current_state",
              "scripts.search_measurement.topvisor_semantic_core",
          ]
          for module in modules:
              importlib.import_module(module)
          PY

      - name: Run public client distribution tests
        run: python -m unittest discover -s tests -p 'test_public_bundle.py'

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Full-source bootstrap fixture and actionlint
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/seohub-public-fixture"
          output="$RUNNER_TEMP/bootstrap.json"
          python -m scripts.project_lifecycle.cli bootstrap \
            --target "$target" \
            --client-version "$GITHUB_SHA" \
            --project-id seo-test \
            --name "SeoHub Test" \
            --repository alexfchkjob-stack/seo-test \
            --domain example.com \
            --timezone Etc/UTC \
            --enable-yandex-metrika \
            --yandex-metrika-counter-id "0" \
            --yandex-metrika-attribution last \
            --enable-yandex-webmaster \
            --yandex-webmaster-host-id "https:example.com:443" \
            --enable-google-search-console \
            --google-search-console-site-url "https://example.com/" \
            --enable-topvisor \
            --topvisor-project-id "0" \
            --enable-xmlstock > "$output"

          TARGET="$target" python - <<'PY'
          import os
          from pathlib import Path
          import yaml
          project = yaml.safe_load((Path(os.environ["TARGET"]) / "project.yaml").read_text(encoding="utf-8"))
          assert project["repository"] == "alexfchkjob-stack/seo-test"
          PY
          jq -e '.source_repository == "finandsilesters-ui/seohub-client"' "$target/.seohub/client.json" >/dev/null
          jq -e '[.secrets.secrets[].name] | sort == [
            "GOOGLE_SEARCH_CONSOLE_CREDENTIALS_JSON",
            "GOOGLE_SEARCH_CONSOLE_REFRESH_TOKEN",
            "TOPVISOR_API_KEY",
            "TOPVISOR_USER_ID",
            "YANDEX_METRIKA_TOKEN",
            "YANDEX_WEBMASTER_TOKEN"
          ]' "$output" >/dev/null

          private_repo="finandsilesters-ui/SeoHub"
          if grep -R "$private_repo/actions/" "$target/.github/workflows" examples; then
            echo "private SeoHub action reference leaked into public client" >&2
            exit 1
          fi

          actionlint="$(go env GOPATH)/bin/actionlint"
          "$actionlint" "$target"/.github/workflows/*.yml
          "$actionlint" examples/*.yml
          "$actionlint" .github/workflows/*.yml

  packaged-action-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - id: install
        name: Execute packaged bootstrap Action by immutable public SHA
        uses: finandsilesters-ui/seohub-client/actions/bootstrap-project@__PUBLIC_CLIENT_SHA__
        with:
          client_version: __PUBLIC_CLIENT_SHA__
          project_id: public-action-smoke
          project_name: Public Action Smoke
          repository: finandsilesters-ui/public-action-smoke
          domain: example.com
          timezone: Etc/UTC

      - name: Verify packaged Action result
        shell: bash
        env:
          STATUS: ${{ steps.install.outputs.status }}
        run: |
          set -euo pipefail
          [[ "$STATUS" == "installed" ]]
          test -f project.yaml
          test -f PROJECT_INSTRUCTIONS.md
          grep -q "Git is read-only by default" PROJECT_INSTRUCTIONS.md
          test -f PROJECT_OPERATIONS.md
          grep -q "Route by evidence need" PROJECT_OPERATIONS.md
          test -f .seohub/client.json
          test -f .github/workflows/seohub-readiness.yml
          jq -e '.source_repository == "finandsilesters-ui/seohub-client"' .seohub/client.json >/dev/null
          jq -e '.installed_version == "__PUBLIC_CLIENT_SHA__"' .seohub/client.json >/dev/null
