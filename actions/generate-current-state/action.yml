name: Generate SeoHub current state
description: Build current_state_v1 from committed project history and compact search state.

inputs:
  project_id:
    description: Stable SeoHub project ID.
    required: true
  project_domain:
    description: Bare project domain used for project SERP presence.
    required: true
  profile_id:
    description: Optional search measurement profile. Leave empty only when search measurement is genuinely unconfigured.
    required: false
    default: ""
  traffic_days:
    description: Equal-length current/previous traffic comparison window.
    required: false
    default: "7"
  traffic_current_until:
    description: Optional explicit current-period end date. Empty selects latest common supported source date.
    required: false
    default: ""
  domain_limit:
    description: Maximum domain-presence rows retained in current_state_v1.
    required: false
    default: "10"
  output:
    description: Project-relative output path.
    required: false
    default: data/aggregates/current-state.json

outputs:
  output:
    description: Generated project-relative current-state path.
    value: ${{ steps.generate.outputs.output }}
  current_from:
    description: Selected current traffic period start.
    value: ${{ steps.generate.outputs.current_from }}
  current_until:
    description: Selected current traffic period end.
    value: ${{ steps.generate.outputs.current_until }}
  previous_from:
    description: Selected previous traffic period start.
    value: ${{ steps.generate.outputs.previous_from }}
  previous_until:
    description: Selected previous traffic period end.
    value: ${{ steps.generate.outputs.previous_until }}
  mixed_run:
    description: Whether current search visibility is composed from multiple compatible runs.
    value: ${{ steps.generate.outputs.mixed_run }}

runs:
  using: composite
  steps:
    - id: generate
      name: Generate compact project current state
      shell: bash
      env:
        INPUT_PROJECT_ID: ${{ inputs.project_id }}
        INPUT_PROJECT_DOMAIN: ${{ inputs.project_domain }}
        INPUT_PROFILE_ID: ${{ inputs.profile_id }}
        INPUT_TRAFFIC_DAYS: ${{ inputs.traffic_days }}
        INPUT_TRAFFIC_CURRENT_UNTIL: ${{ inputs.traffic_current_until }}
        INPUT_DOMAIN_LIMIT: ${{ inputs.domain_limit }}
        INPUT_OUTPUT: ${{ inputs.output }}
      run: |
        set -euo pipefail
        SEOHUB_ROOT="$(cd "$GITHUB_ACTION_PATH/../.." && pwd)"
        generated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
        args=(
          --project-root "$GITHUB_WORKSPACE"
          --project-id "$INPUT_PROJECT_ID"
          --project-domain "$INPUT_PROJECT_DOMAIN"
          --traffic-days "$INPUT_TRAFFIC_DAYS"
          --generated-at "$generated_at"
          --domain-limit "$INPUT_DOMAIN_LIMIT"
          --output "$INPUT_OUTPUT"
        )
        if [[ -n "$INPUT_PROFILE_ID" ]]; then
          args+=(--profile-id "$INPUT_PROFILE_ID")
        fi
        if [[ -n "$INPUT_TRAFFIC_CURRENT_UNTIL" ]]; then
          args+=(--traffic-current-until "$INPUT_TRAFFIC_CURRENT_UNTIL")
        fi

        result="$(
          PYTHONPATH="$SEOHUB_ROOT${PYTHONPATH:+:$PYTHONPATH}" \
            python3 -m scripts.analysis.project_current_state "${args[@]}"
        )"
        printf '%s\n' "$result"

        RESULT_JSON="$result" INPUT_OUTPUT="$INPUT_OUTPUT" python3 - <<'PY' >> "$GITHUB_OUTPUT"
        import json
        import os

        result = json.loads(os.environ["RESULT_JSON"])
        periods = result["traffic_periods"]
        print(f"output={os.environ['INPUT_OUTPUT']}")
        for key in ("current_from", "current_until", "previous_from", "previous_until"):
            print(f"{key}={periods[key]}")
        print(f"mixed_run={str(result['mixed_run']).lower()}")
        PY
