name: Collect Yandex Metrika
description: Collect normalized organic-search data from Yandex Metrika.

inputs:
  project:
    description: Stable SeoHub project ID.
    required: true
  counter_id:
    description: Yandex Metrika counter ID.
    required: true
  attribution:
    description: Explicit Yandex Metrika attribution model.
    required: true
  token:
    description: Yandex Metrika OAuth token.
    required: true
  days:
    description: Number of complete days to refresh when explicit dates are omitted.
    required: false
    default: "3"
  date_from:
    description: Optional explicit start date in YYYY-MM-DD format.
    required: false
    default: ""
  date_to:
    description: Optional explicit end date in YYYY-MM-DD format.
    required: false
    default: ""
  history_dir:
    description: Optional normalized history directory. Enables monthly history merging.
    required: false
    default: ""
  url_normalization_config:
    description: Optional project URL-normalization JSON config applied before normalized history is written.
    required: false
    default: ""
  output_dir:
    description: Snapshot output directory when history_dir is not used.
    required: false
    default: data/snapshots/yandex_metrika
  output_file:
    description: Optional exact snapshot output path when history_dir is not used.
    required: false
    default: ""

outputs:
  snapshot_path:
    description: Temporary or persisted collection snapshot path.
    value: ${{ steps.collect.outputs.snapshot_path }}
  manifest_path:
    description: History manifest path when history_dir is used.
    value: ${{ steps.collect.outputs.manifest_path }}
  storage_cli_path:
    description: Shared storage CLI path for verified post-validation pruning/materialization.
    value: ${{ steps.collect.outputs.storage_cli_path }}

runs:
  using: composite
  steps:
    - id: collect
      shell: bash
      env:
        YANDEX_METRIKA_TOKEN: ${{ inputs.token }}
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_COUNTER_ID: ${{ inputs.counter_id }}
        INPUT_ATTRIBUTION: ${{ inputs.attribution }}
        INPUT_DAYS: ${{ inputs.days }}
        INPUT_DATE_FROM: ${{ inputs.date_from }}
        INPUT_DATE_TO: ${{ inputs.date_to }}
        INPUT_HISTORY_DIR: ${{ inputs.history_dir }}
        INPUT_URL_NORMALIZATION_CONFIG: ${{ inputs.url_normalization_config }}
        INPUT_OUTPUT_DIR: ${{ inputs.output_dir }}
        INPUT_OUTPUT_FILE: ${{ inputs.output_file }}
      run: |
        set -euo pipefail

        args=(
          --project "$INPUT_PROJECT"
          --counter-id "$INPUT_COUNTER_ID"
          --attribution "$INPUT_ATTRIBUTION"
          --days "$INPUT_DAYS"
        )

        if [[ -n "$INPUT_DATE_FROM" || -n "$INPUT_DATE_TO" ]]; then
          args+=(--date-from "$INPUT_DATE_FROM" --date-to "$INPUT_DATE_TO")
        fi

        if [[ -n "$INPUT_HISTORY_DIR" ]]; then
          snapshot_path="$RUNNER_TEMP/seohub-metrika-snapshot.json"
          args+=(--output-file "$snapshot_path")
        else
          args+=(--output-dir "$INPUT_OUTPUT_DIR")
          if [[ -n "$INPUT_OUTPUT_FILE" ]]; then
            args+=(--output-file "$INPUT_OUTPUT_FILE")
          fi
        fi

        snapshot_path="$(
          python3 "${{ github.action_path }}/../../scripts/metrika/collect.py" "${args[@]}"
        )"
        echo "snapshot_path=$snapshot_path" >> "$GITHUB_OUTPUT"

        storage_cli="${{ github.action_path }}/../../scripts/storage/cli.py"
        echo "storage_cli_path=$storage_cli" >> "$GITHUB_OUTPUT"

        if [[ -n "$INPUT_HISTORY_DIR" ]]; then
          if [[ -f "$INPUT_HISTORY_DIR/storage-refs.json" ]]; then
            if [[ "${SEOHUB_STORAGE_BACKEND:-}" == "s3" || -n "${SEOHUB_STORAGE_S3_BUCKET:-}" ]]; then
              python3 -m pip install --disable-pip-version-check --quiet \
                -r "${{ github.action_path }}/../../scripts/storage/requirements-s3.txt"
            fi
            python3 "$storage_cli" materialize \
              --history-dir "$INPUT_HISTORY_DIR" \
              --all
          fi

          history_args=(
            --snapshot "$snapshot_path"
            --history-dir "$INPUT_HISTORY_DIR"
          )
          if [[ -n "$INPUT_URL_NORMALIZATION_CONFIG" ]]; then
            history_args+=(--url-normalization-config "$INPUT_URL_NORMALIZATION_CONFIG")
          fi

          changed_file="$RUNNER_TEMP/seohub-metrika-history-changed.txt"
          python3 "${{ github.action_path }}/../../scripts/metrika/history.py" \
            "${history_args[@]}" | tee "$changed_file"

          if [[ -f "$INPUT_HISTORY_DIR/storage-refs.json" ]]; then
            python3 "$storage_cli" externalize-changed \
              --history-dir "$INPUT_HISTORY_DIR" \
              --project "$INPUT_PROJECT" \
              --source yandex_metrika \
              --changed-file "$changed_file"
          fi
          echo "manifest_path=$INPUT_HISTORY_DIR/manifest.json" >> "$GITHUB_OUTPUT"
        fi
