name: SeoHub project readiness
description: Validate the installed thin client, project configuration and required Secret presence without executing provider code locally.

inputs:
  live_auth:
    description: Compatibility input. Thin-client v2 performs provider connectivity only through hosted operations.
    required: false
    default: "false"
  yandex_metrika_token:
    required: false
    default: ""
  yandex_webmaster_token:
    required: false
    default: ""
  google_search_console_credentials_json:
    required: false
    default: ""
  google_search_console_refresh_token:
    required: false
    default: ""
  topvisor_user_id:
    required: false
    default: ""
  topvisor_api_key:
    required: false
    default: ""
  xmlstock_user_id:
    required: false
    default: ""
  xmlstock_api_key:
    required: false
    default: ""

outputs:
  report_file:
    description: Machine-readable local readiness report on the runner.
    value: ${{ steps.readiness.outputs.report_file }}
  source_connectivity_status:
    description: Configuration/Secret-presence status. It does not prove provider connectivity.
    value: ${{ steps.readiness.outputs.source_connectivity_status }}
  project_readiness_status:
    description: Local installation/bootstrap readiness; hosted authorization is separate.
    value: ${{ steps.readiness.outputs.project_readiness_status }}

runs:
  using: composite
  steps:
    - name: Install lifecycle dependency
      shell: bash
      run: |
        set -euo pipefail
        python3 -m pip install --disable-pip-version-check --quiet           -r "${{ github.action_path }}/../../scripts/project_lifecycle/requirements.txt"

    - id: readiness
      name: Validate local thin-client readiness
      shell: bash
      env:
        YANDEX_METRIKA_TOKEN: ${{ inputs.yandex_metrika_token }}
        YANDEX_WEBMASTER_TOKEN: ${{ inputs.yandex_webmaster_token }}
        GOOGLE_SEARCH_CONSOLE_CREDENTIALS_JSON: ${{ inputs.google_search_console_credentials_json }}
        GOOGLE_SEARCH_CONSOLE_REFRESH_TOKEN: ${{ inputs.google_search_console_refresh_token }}
        TOPVISOR_USER_ID: ${{ inputs.topvisor_user_id }}
        TOPVISOR_API_KEY: ${{ inputs.topvisor_api_key }}
        XMLSTOCK_USER_ID: ${{ inputs.xmlstock_user_id }}
        XMLSTOCK_API_KEY: ${{ inputs.xmlstock_api_key }}
      run: |
        set -euo pipefail
        report_file="$RUNNER_TEMP/seohub-readiness.json"
        set +e
        python3 "${{ github.action_path }}/../../scripts/project_lifecycle/cli.py"           --source-root "${{ github.action_path }}/../.."           readiness           --target "$GITHUB_WORKSPACE" > "$report_file"
        rc=$?
        set -e

        if [[ "$rc" -ne 0 && "$rc" -ne 3 ]]; then
          exit "$rc"
        fi

        jq -e . "$report_file" >/dev/null
        echo "report_file=$report_file" >> "$GITHUB_OUTPUT"
        echo "source_connectivity_status=$(jq -er '.source_connectivity.status' "$report_file")" >> "$GITHUB_OUTPUT"
        echo "project_readiness_status=$(jq -er '.project_readiness.status' "$report_file")" >> "$GITHUB_OUTPUT"
        cat "$report_file"
